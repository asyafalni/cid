# Test services for `zig build integration`. Versions pinned on purpose
# (CLAUDE.md, storage rules); bump them only in their own change.
services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: cid
      POSTGRES_PASSWORD: cid-test
      POSTGRES_DB: cid_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cid -d cid_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The store checks every signature with the test keys, as a real
  # deployment's does: a URL signed for the wrong host or with the wrong
  # key fails here too, instead of passing only in tests.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64
    volumes:
      - ./tests/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      # Any answer will do: unsigned requests get a 403 now.
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://127.0.0.1:8333 2>&1 | grep -q 'HTTP/'"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The 'cid' bucket, created once the store is up: bucket creation is the
  # deployment's job (nilo_s3 has no CreateBucket, on purpose), and this
  # service is the reference for how a real deployment does it.
  seaweedfs-bucket:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo 's3.bucket.create -name cid' | weed shell -master=seaweedfs:9333 || true"]
    restart: "no"
