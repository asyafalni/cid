# Test services for `zig build integration`. Versions pinned on purpose
# (CLAUDE.md, storage rules); bump them only in their own change.
services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: cid
      POSTGRES_PASSWORD: cid-test
      POSTGRES_DB: cid_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cid -d cid_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
