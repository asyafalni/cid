# cid SSH front door (docs/access.md, invariant 22): SSH only
# authenticates and hands out short-lived HTTPS tokens. No shell, no
# forwarding, no data over SSH.
#
# Install as /etc/ssh/sshd_config.d/cid.conf (or merge into sshd_config),
# create the system user 'cid' with no password and shell /usr/sbin/nologin,
# and install /usr/local/bin/cid plus the wrapper next to this file.

Match User cid
    # Keys come from the database, through cid, not from files on disk.
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/bin/cid-ssh-keys %f
    AuthorizedKeysCommandUser cid

    # Belt and braces: the per-key "restrict,command=…" line from
    # AuthorizedKeysCommand already forbids all of this.
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    ForceCommand none

    PasswordAuthentication no
    KbdInteractiveAuthentication no
