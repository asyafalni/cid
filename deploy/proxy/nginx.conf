# cid behind nginx: HTTPS for the server and for its file store. Replace
# the two names and the certificate paths, then include this file from
# nginx.conf's http block. What each part is for: README.md beside it.

# The cid server: the CLI, the dashboard and the SSH front door's
# hand-outs all use this name (CID_PUBLIC_URL=https://cid.example.com).
server {
    listen 443 ssl;
    http2 on;
    server_name cid.example.com;
    ssl_certificate     /etc/letsencrypt/live/cid.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cid.example.com/privkey.pem;

    # The API takes bodies up to 64 MB (a push's commits); files never
    # pass here, they go to the store below.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A release of a million items takes about half a minute and a
        # first export some seconds; give long requests room.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# The file store (SeaweedFS's S3 port). Clients fetch and upload files
# here directly, through URLs the cid server signs for this name
# (CID_S3_ENDPOINT=https://s3.cid.example.com), so the Host header must
# reach the store unchanged.
server {
    listen 443 ssl;
    http2 on;
    server_name s3.cid.example.com;
    ssl_certificate     /etc/letsencrypt/live/s3.cid.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.cid.example.com/privkey.pem;

    # Uploads come in 64 MB pieces and downloads can be any size: no
    # limit, and both stream through instead of filling nginx's disk.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8333;
        proxy_http_version 1.1;
        # Exactly as the client sent it, port included ($host drops the
        # port, and the signature then no longer matches).
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# Plain HTTP only sends people to HTTPS.
server {
    listen 80;
    server_name cid.example.com s3.cid.example.com;
    return 301 https://$host$request_uri;
}
